# Apo search contract — template / example
# Copy to <vault>/system/contracts/search-contract.schema.yaml and edit.
# Legacy path system/config/search-contract.schema.yaml still loaded.
# Runtime: unscoped search_notes / CLI search / RPC /v1/search and history browse
# when exclude= is omitted and folder= is empty. Caller exclude= always wins.

search_contract_version: "0.1"

# Path globs (vault-relative) dropped from unscoped hybrid search and history browse.
# Measured +8pts hit@5 on noisy PARA vaults with inbox/daily + archives excluded.
# Sessions/audit vaults should use [] — inbox/daily is primary content there.
default_exclude:
  - inbox/daily/*
  - archives/*
  # - inbox/zettels/*
  # - system/agent-client/*

# Folder-scoped excludes (applied when folder= matches; skipped if unless_query tokens appear).
# folder_exclude:
#   - folder: areas/threads
#     exclude:
#       - areas/threads/apo-qmd-retrieval-pilot.md
#     unless_query:
#       - qmd
#       - retrieval pilot
#   - folder: diagrams/mermaid-catalog
#     exclude:
#       - diagrams/mermaid-catalog/pages/**
#     unless_query:
#       - confluence
#       - page body

# Vault-specific architecture/system vocabulary for the unscoped "architecture
# query" boost (promotes diagrams/mermaid-catalog recall vault-wide when the
# query looks like a DFD/CDE/payment-flow question — folder-scoped
# mermaid-catalog search already boosts regardless of this list).
# Terms match case-insensitively; multi-word phrases tolerate a hyphen or
# extra whitespace in place of a space, and a literal "." is optional (so
# "authorize.net" also matches "authorizenet").
# Leave this unset (or empty) for vaults with no internal system/vendor names
# worth boosting — there is no built-in fallback list, so no boost_vocab means
# no architecture-query boost at all.
# boost_vocab:
#   - cde
#   - chd
#   - pci
#   - pan
#   - cardholder
#   - segmentation
#   - architecture
#   - data flow
#   - network diagram
#   - payment processor
#   - diagram.mmd
#   - mermaid
#   # - <your-vendor-or-internal-system-name>
#   # - <another-one>

