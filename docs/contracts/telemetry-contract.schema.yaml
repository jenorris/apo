# Apo telemetry contract — template / example
# Copy to <vault>/system/contracts/telemetry-contract.schema.yaml
# Prose twin: docs/contracts/telemetry.md
# Privacy and agent access are vault-defined — not hardcoded in the engine.

telemetry_contract_version: "0.2"
enabled: true

store:
  backend: embedded # embedded | local | none
  path: ~/.apo/metrics.sqlite # SQLite, WAL mode

# Retired after 0.38.0: the separate OTLP forwarder is gone, so `otel.export` is accepted
# and ignored. For spans, set store.backend: otlp | both (pip install apo-engine[otlp]).
# otel:
#   export: true

# The recorder is allow-list by construction: it reads allow.paths / headings /
# chunk_hash and whether conversation_id is in allow.dimensions. It never
# captures note bodies, queries, prompts, or raw tool arguments, so `deny` is
# documentation of that guarantee, not an ingest filter.
privacy:
  allow:
    dimensions: [tool, ok, duration_ms, collection, conversation_id, vault_id, apo_version]
    paths: vault_relative # none | hash_only | vault_relative | absolute
    headings: true
    chunk_hash: true
  deny:
    - note_body
    - search_query
    - prompt_text
    - tool_arguments_raw

retention_days: 90

agent_access:
  expose_paths: true

# Optional KPI thresholds for telemetry(action=efficiency) tips
efficiency:
  folder_scoped_target_pct: 80
  expand_to_search_target_pct: 10
  error_rate_max_pct: 5
  large_read_bytes: 15000
