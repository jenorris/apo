# usage-contract — host-neutral vault usage IR (template)
#
# Copy to <vault>/system/contracts/usage-contract.schema.yaml and edit.
# Discovered by vault(action=contracts|describe|merge|project).
# Apo engine does NOT interpret these fields for search/write — harnesses and
# desk projection consume them. Machine behavior stays in okf/git/… contracts.
#
# Determinism: same APO_VAULTS + same usage YAMLs → byte-identical projected
# skill for a given host (cursor | claude | hermes). No LLM in the compile path.

usage_contract_version: "0.1"

# Registry id this file belongs to (should match APO_VAULTS key).
vault_id: myvault

purpose: >
  One-line what this vault is for (e.g. personal PKB, employer threads,
  household PARA, audit session logs).

in_scope:
  - topics and folders agents should treat as primary here
out_scope:
  - what must not be written or imported from other vaults

# folder → short rule (no cross-vault OKF/layout bleed).
layout:
  inbox: capture / working memory
  areas: standing responsibilities
  projects: time-bounded work
  resources: reference
  archives: cold storage

# Minimal frontmatter keys agents should stamp on concept notes (optional).
frontmatter_floor:
  - title
  # - okf_type
  # - status
  # - description
  # - timestamp

# Enum-ish habit ids (documented in docs/agent-throughput.md; projected into apo-desk § Apo throughput).
# Channel split: tip=habits · warning=ops · flaws=corpus. Prefer address_flaws_on_write.
# Each entry is normally a bare string id, resolved against the engine's built-in
# id → prose dict. A vault whose dialect diverges from that dict (e.g. tags notes
# by memory_type instead of okf_type) can supply its own text inline instead of
# hitting the generic "see usage-contract / apo-write-api" fallback:
#   - id: my_custom_habit
#     text: "One-line imperative guidance, same voice as the built-in lines."
write_habits:
  - prefer_append_patch
  - folder_on_search
  - expected_mtime_on_followup
  - filter_okf_type
  - patch_note_wire
  - chunk_hash_surgical
  - dedupe_search
  - vault_api_routing
  - address_flaws_on_write
  # - lint_before_conclude

# Authoring dialect + optional render profile (harness / desk projection).
# Dialect = what agents may put in .md bodies. Render = export/publish only
# (e.g. just htmlize). Do not invent dialect enums like "obsidian-ofm+tailwind"
# — Tailwind is stylesheet provenance under render, not an authoring dialect.
# Projected into apo-desk as a one-liner per vault; deep OFM tables stay in
# contribution.pointers (not inlined — respect token_budget).
contribution:
  dialect: gfm   # plain-md | gfm | obsidian-ofm
  # features:     # never | sparse | preferred | required | ok | rare
  #   wikilinks: required
  #   callouts: preferred
  #   embeds: sparse
  #   highlight: sparse
  #   comments: ok
  #   mermaid: ok
  #   math: rare
  # surfaces:     # optional overrides by note kind
  #   session_log: { dialect: gfm, callouts: never }
  #   ops_card: { callouts: preferred }
  # render:       # omit = Obsidian / raw MD only
  #   profile: htmlize   # none | htmlize
  #   stylesheet: system/assets/htmlize.css
  #   pointer: meta:system/skills/htmlize-design
  # pointers:
  #   - meta:system/config/obsidian-callouts

# Paths to machine contracts this vault also ships (relative to vault root).
machine_contracts:
  - system/contracts/git-contract.schema.yaml
  # - system/contracts/okf-contract.schema.yaml

# Expected MCP / CLI surface for agents working this vault's domain.
# Harness / desk projection only — does not start or stop Cursor MCP processes.
# Host keys match ~/.cursor/mcp.json / plugin ids (no secrets here).
# Semantics:
#   required — must be available for consequential work in this vault (usually apo)
#   expected — default tools when working this vault's domain
#   optional — situational / parkable (ops, debugging)
#   never    — cross-pollination guard (do not treat as primary here)
# When stdio servers sit behind a Cursor proxy (e.g. lazy-mcp), set mcp.proxy so
# apo-desk projects an ## MCP proxy section — agents must invoke via the proxy,
# not expect top-level Cursor tools named after the backend.
# integrations:
#   mcp:
#     required: [apo]
#     expected: []
#     optional: []
#     never: []
#     proxy:
#       name: lazy-mcp          # Cursor mcp.json host key
#       via: []                 # backends normally reachable through the proxy
#       parked: []              # enabled:false until flipped in catalog
#       catalog: vault:path/to/servers.json
#       enable_parked: "Set enabled:true in catalog, then SIGHUP proxy PID / reload MCP"
#       # invoke: optional override of default list_servers → … → invoke_command tip
#   cli:
#     expected: []   # e.g. gws, acli, gh — or a bare list under cli:
#   pointers: []     # deep how-tos (source-routing, work-environment, lazy-mcp)

# Optional deep docs — not inlined into projected skills (token budget).
# Use vault_id:relative/path or absolute paths.
pointers: []

# Soft cap for harness-compiled skill snippets drawn from this file. Applied
# today to the okf-contract path_rules table in the projected "Type routing"
# section (approx chars/4 estimate) — the largest single addition a vault can
# make to the compiled skill.
token_budget: 800

# Agent-behavior directives, projected verbatim into apo-desk § Vault directives
# when set. Optional — most vaults don't need either.
# consult_vault_first: >
#   When agents must search/read this vault BEFORE asking the operator for a
#   fact this vault is the source of truth for (e.g. personal/device facts).
# task_routing: >
#   How to file a task/todo for this vault's domain (e.g. "create or update
#   areas/threads/<slug>.md; do not create flat tasks.md entries").
