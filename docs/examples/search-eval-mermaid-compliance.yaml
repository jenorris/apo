# Mermaid search eval — compliance DFD catalog
# Copy to ~/.apo/search-eval-mermaid-compliance.yaml
# Run: just search-eval --file ~/.apo/search-eval-mermaid-compliance.yaml

vault: compliance
k: 3

queries:
  - query: Stripe payment processor standard data flow
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/standard-data-flow/diagram.mmd]
    expect_chunk_kind: mermaid_node
    expect_entity: Stripe

  - query: GradGuard renters program billing API
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/standard-data-flow/diagram.mmd]
    expect_chunk_kind: mermaid_node
    expect_entity: RAPI

