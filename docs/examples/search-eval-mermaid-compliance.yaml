# Mermaid search eval — compliance DFD catalog
# Copy to ~/.apo/search-eval-mermaid-compliance.yaml
# Run: just search-eval --file ~/.apo/search-eval-mermaid-compliance.yaml
#
# Re-labeled 2026-09-27 (harden-search-eval): the 2026-08-26 doc migration
# (258fba9, "Migrate partner/internal diagram pages…") moved most diagrams from
# `<slug>/diagram.mmd` into `<new-slug>/<new-slug>.md` fenced blocks and renamed
# several slugs — this silently broke 18/19 expect paths (hit@3 86%→0%, unnoticed
# for a month; `just check-evals`'s stale-expect gate now catches this same-day).
# Paths below verified directly against ~/Workbench/compliance/diagrams/mermaid-catalog/
# and its catalog.yaml (`former_slug` field confirms several renames):
#   standard-data-flow, agency-data-flow: slug unchanged, file renamed diagram.mmd → <slug>.md
#   network-diagram-pci → cde-network-diagram-pci-edition (still diagram.mmd, not fenced)
#   network-diagram → aws-network-diagram (still diagram.mmd, not fenced)
#   integrated-api-v2, renters-pro-api, tuition-pro-api, delegated-tuition,
#     nelnet-integration-v2, touchnet-integration, coverage-confirmation-pro,
#     integrated-data-flow → each renamed to `<name>-data-flow` (or `-legacy`),
#     file renamed diagram.mmd → <new-slug>.md
#   enrollment-renters-portal-starrez → starrez-renters-portal-integration-data-flow
#   enrollment-tuition-retail → tuition-retail-enrollment-ux-flow
#   enrollment-renters-retail → renters-retail-enrollment-ux-flow
#   enrollment-tuition-pro-api → tuition-pro-api-enrollment-ux-flow
#   enrollment-renters-pro-api → renters-pro-api-enrollment-ux-flow
#   enrollment-tuition-integrated → transact-campus-tuition-integration-data-flow
#     (catalog.yaml former_slug confirms this one directly)
#   cardholder-data-flow: unchanged path — role now `deprecated` (superseded by the
#     per-channel diagrams above; DEPRECATED.md notes the stub diagram.mmd stays for
#     audit trail only) but the file itself still exists, so the expect path is not
#     stale. Left the query as-is; it's still a legitimate retrieval target today.
# Chunk-kind/entity semantics unaffected by path renames — left as originally
# authored; re-scoring those against the mermaid_parse.py/mermaid_index.py fix is
# the coordinating session's job, not this pass's.

