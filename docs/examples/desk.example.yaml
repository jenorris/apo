# Apo desk overlay — host-level multi-vault policy (not vault content).
# Copy to ~/.apo/desk.yaml (or set APO_DESK_CONFIG).
# Consumed by vault(action=merge|project). Per-vault machine contracts stay in system/contracts/.
# After edits: `just desk-project` (or let apo-engine watch auto-reproject).

desk_version: "0.1"

# Never copy OKF/layout/frontmatter rules from one vault into another.
cross_pollinate_contracts: false

# How agents should cite vault notes in chat (Cursor cannot resolve [[wiki-links]]).
citations: absolute_markdown  # absolute_markdown | wiki

# Optional multi-root workspace path shown in projected desk skill.
workspace: ""

# Legacy manual session-log dual-write (retired — use session telemetry + Cursor hooks).
# dual_write:
#   enabled: true
#   session_vault: sessions
#   session_path_template: "inbox/daily/{date}.md"
#   session_heading: "Session log"

vault_roles:
  meta: pkb
  norris: household
  work: employer
  sessions: audit
  contracts: silo

habits:
  end_of_turn_gate: true
  new_durable_facts: true
  prefer_append_patch: true
  filter_okf_type: true

# Short role blurbs for projected desk skill (optional).
role_notes: {}

# Deep policy docs — use vault_id:relative/path (expanded to absolute .md links on project).
# pointers:
#   memory_policy: "meta:system/config/agent-memory-policy"
#   write_api: "meta:system/config/apo-write-api"
#   source_routing: "meta:system/config/source-routing"
pointers: {}
