# Mermaid policy-relay eval — compliance vault
# Measures whether flattened diagram chunks surface architecture facts
# that support policy-grounded questions (CDE, CHD, Stripe, ECS, …).
#
# Copy to ~/.apo/search-eval-mermaid-policy-relay.yaml
# Run: just search-eval --file ~/.apo/search-eval-mermaid-policy-relay.yaml
#
# Gates (plan): catalog-scoped hit@3 ≥ 75%; vault-wide hit@3 ≥ 60%.

vault: compliance
k: 3

queries:
  # --- Tier C: catalog-scoped (folder=diagrams/mermaid-catalog) ---
  - query: remote access cardholder data environment network
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/network-diagram-pci/diagram.mmd]
    expect_chunk_kind: mermaid_file

  - query: ECS tasks cardholder data environment
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/network-diagram-pci/diagram.mmd]

  - query: cardholder data environment incident scope systems
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/cardholder-data-flow/diagram.mmd]

  - query: PCI compliant third party payment processors
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/standard-data-flow/diagram.mmd]
    expect_entity: Stripe

  - query: where does cardholder data flow to Stripe
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/cardholder-data-flow/diagram.mmd]
    expect_entity: Stripe

  - query: Authorize.net ACH payment flow
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/cardholder-data-flow/diagram.mmd]
    expect_entity: Authorize

  - query: renters program skypad payment
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/cardholder-data-flow/diagram.mmd]
    expect_entity: SKY

  - query: tuition faber payment processor
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/cardholder-data-flow/diagram.mmd]
    expect_entity: FAB

  - query: CDE segmentation network isolation PCI
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/network-diagram-pci/diagram.mmd]

  - query: cortana agency policy admin data flow
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/agency-data-flow/diagram.mmd]

  - query: delegated tuition billing only
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/delegated-tuition/diagram.mmd]

  - query: StarRez housing portal enrollment
    folder: diagrams/mermaid-catalog
    expect: [diagrams/mermaid-catalog/enrollment-renters-portal-starrez/diagram.mmd]

  # --- Tier D: vault-wide (no folder=) — diagram must still rank ≤3 ---
  - query: how does GradGuard transmit cardholder data to payment processors
    expect: [diagrams/mermaid-catalog/cardholder-data-flow/diagram.mmd]

  - query: what AWS resources are in the cardholder data environment
    expect: [diagrams/mermaid-catalog/network-diagram-pci/diagram.mmd]

  - query: CDE ECS container Stripe payment
    expect:
      - diagrams/mermaid-catalog/cardholder-data-flow/diagram.mmd
      - diagrams/mermaid-catalog/network-diagram-pci/diagram.mmd

  - query: no CHD storage payment processor architecture
    expect: [diagrams/mermaid-catalog/standard-data-flow/diagram.mmd]

  - query: cardholder data flow Stripe Authorize.net skypad faber
    expect: [diagrams/mermaid-catalog/cardholder-data-flow/diagram.mmd]

  - query: PCI CDE network segmentation diagram architecture
    expect: [diagrams/mermaid-catalog/network-diagram-pci/diagram.mmd]

  - query: agency cortana call center agent data flow diagram
    expect: [diagrams/mermaid-catalog/agency-data-flow/diagram.mmd]

  - query: StarRez renters enrollment portal integration architecture
    expect: [diagrams/mermaid-catalog/enrollment-renters-portal-starrez/diagram.mmd]

  - query: delegated tuition only billing architecture flow
    expect: [diagrams/mermaid-catalog/delegated-tuition/diagram.mmd]

  - query: standard data flow renters tuition Stripe payment processor
    expect: [diagrams/mermaid-catalog/standard-data-flow/diagram.mmd]
