name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  go-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: client/go.sum
      - name: Test Go client
        working-directory: client
        run: go test ./...

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      # setup-python macOS builds omit SQLite loadable extensions (needed for sqlite-vec).
      # Homebrew Python links Homebrew SQLite, which enables enable_load_extension.
      - name: Set up Python (Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Python (macOS via Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install "python@${{ matrix.python-version }}"
          BREW_PREFIX="$(brew --prefix "python@${{ matrix.python-version }}")"
          echo "${BREW_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "PYTHON_BIN=${BREW_PREFIX}/bin/python${{ matrix.python-version }}" >> "$GITHUB_ENV"
          "${BREW_PREFIX}/bin/python${{ matrix.python-version }}" - <<'PY'
          import sqlite3
          c = sqlite3.connect(":memory:")
          assert hasattr(c, "enable_load_extension"), "Homebrew Python lacks loadable SQLite extensions"
          print("sqlite", sqlite3.sqlite_version, "ok")
          PY

      - name: Sync locked engine environment
        working-directory: engine
        run: |
          PYTHON="${PYTHON_BIN:-python}"
          uv sync --locked --python "$PYTHON" --extra mcp --extra dev

      - name: Run tests
        working-directory: engine
        # -n auto: pytest-xdist (dev extra). The suite is hermetic (conftest.py gives each
        # worker its own HOME and per-test runtime dirs). --durations keeps slow tests visible.
        run: .venv/bin/python -m pytest tests -q -n auto --durations=20

      - name: Check public facts
        run: engine/.venv/bin/python scripts/check_public_facts.py

      - name: Check stale vocabulary
        run: engine/.venv/bin/python scripts/check_stale_vocabulary.py
