[Service]
# Added 2026-08-15 during OOM triage (kanban t_104fb82d).
#
# apo-engine steady state on Grid: serve ~95MB RSS, watch ~55-70MB RSS.
# Embedding batches spike transiently but have never exceeded ~300MB.
# These caps are ~5x headroom over observed peak — they exist purely so a
# future leak in the engine cannot repeat the 2026-08-15 system-wide OOM.
#
# MemoryHigh is the soft throttle (reclaim pressure, no kill). MemoryMax is
# the hard cap: exceeding it kills only THIS unit's cgroup, and systemd's
# Restart=always brings it straight back — the failure stays local to the
# engine instead of taking the whole box (and Cato's session) with it.
MemoryHigh=768M
MemoryMax=1536M
