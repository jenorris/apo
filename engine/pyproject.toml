[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apo-engine"
version = "0.12.3"
description = "Apo — local hybrid search over a Markdown vault (sqlite-vec, no Docker)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jeremy Norris" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "duckdb>=1.0",
    "sqlite-vec>=0.1.6",
    "pyyaml>=6.0",
    # Round-trip YAML (comment/format preserving) for every note write site.
    # PyYAML stays as the tolerant fallback loader.
    "ruamel.yaml>=0.18",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
# Optional ONNX embedder (APO_EMBED_BACKEND=fastembed). Not needed for Ollama desk default.
cpu = ["fastembed>=0.8.0"]
# Optional cross-encoder reranker (APO_RERANK=1). Same ONNX runtime as `cpu`.
rerank = ["fastembed>=0.8.0"]
mcp = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
]
# Optional OTLP span forwarding (APO_OTEL_EXPORT=1 or OTEL_EXPORTER_OTLP_ENDPOINT).
# No-op when absent — DuckDB metrics remain the default sink.
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
dev = ["pytest>=8.0"]

[project.scripts]
apo-engine = "apo_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
