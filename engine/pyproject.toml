[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apo-engine"
version = "0.27.0"
description = "Apo — local hybrid search over a Markdown vault (sqlite-vec, no Docker)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jeremy Norris" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "duckdb>=1.0",
    "sqlite-vec>=0.1.6",
    "pyyaml>=6.0",
    # Round-trip YAML (comment/format preserving) for every note write site.
    # PyYAML stays as the tolerant fallback loader.
    "ruamel.yaml>=0.18",
    "watchdog>=4.0.0",
    # Scratchpad / bind_schema JSON Schema validation (Draft 2020-12).
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# Optional ONNX embedder (APO_EMBED_BACKEND=fastembed). Not needed for Ollama desk default.
cpu = ["fastembed>=0.8.0"]
# Optional cross-encoder reranker (APO_RERANK=1). Same ONNX runtime as `cpu`.
rerank = ["fastembed>=0.8.0"]
mcp = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
]
# Optional OTLP span forwarding (APO_OTEL_EXPORT=1 or OTEL_EXPORTER_OTLP_ENDPOINT).
# No-op when absent — DuckDB metrics remain the default sink. Used by the
# additive otel_forwarder (each event also emitted as a span alongside DuckDB).
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Optional OTLP span export (store.backend = otlp | both). Kept optional so the
# engine still installs without it; OtlpBackend fails closed if absent. Used
# by otlp_backend, a selectable store backend (replaces DuckDB rather than
# forwarding alongside it).
otlp = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]
# joserfc/starlette back test_mcp_auth_google.py (mock RS256 JWKS + an ASGI
# TestClient) — real deps today only via fastmcp's transitive install, which
# a fastmcp version bump could silently drop.
dev = ["pytest>=8.0", "joserfc>=1.0", "starlette>=0.37"]

[project.scripts]
apo-engine = "apo_engine.cli:main"
# Vault-facing CLI (read/search/write/append/patch/...), mirrors the MCP
# note/vault tools. NOT the admin engine CLI above. Collision note: a
# pre-existing ~/.local/bin/apo shell wrapper hardcodes an exec of the
# admin apo-engine binary from the deployed venv path — it does not resolve
# `apo` by PATH, so it is untouched by this entry. This console script only
# takes effect where this package is installed (e.g. `<venv>/bin/apo`);
# activating that venv puts it ahead of ~/.local/bin on PATH, so the
# vault-facing CLI wins there while the global shell alias keeps pointing
# at admin ops. If the two ever need to coexist without venv activation,
# repoint the global alias at `apo-engine`'s replacement explicitly rather
# than renaming either console script.
apo = "apo_engine.cli_ops:main"

[tool.setuptools.packages.find]
where = ["src"]
