[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apo-engine"
version = "0.31.0"
description = "Apo — local hybrid search over a Markdown vault (sqlite-vec, no Docker)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jeremy Norris" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "duckdb>=1.0",
    "sqlite-vec>=0.1.6",
    "pyyaml>=6.0",
    # Round-trip YAML (comment/format preserving) for every note write site.
    # PyYAML stays as the tolerant fallback loader.
    "ruamel.yaml>=0.18",
    "watchdog>=4.0.0",
    # Scratchpad / bind_schema JSON Schema validation (Draft 2020-12).
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# Optional ONNX embedder (APO_EMBED_BACKEND=fastembed). Not needed for Ollama desk default.
cpu = ["fastembed>=0.8.0"]
# Optional cross-encoder reranker (APO_RERANK=1). Same ONNX runtime as `cpu`.
rerank = ["fastembed>=0.8.0"]
mcp = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
]
# Optional OTLP span forwarding (APO_OTEL_EXPORT=1 or OTEL_EXPORTER_OTLP_ENDPOINT).
# No-op when absent — DuckDB metrics remain the default sink. Used by the
# additive otel_forwarder (each event also emitted as a span alongside DuckDB).
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Optional OTLP span export (store.backend = otlp | both). Kept optional so the
# engine still installs without it; OtlpBackend fails closed if absent. Used
# by otlp_backend, a selectable store backend (replaces DuckDB rather than
# forwarding alongside it).
otlp = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]
# joserfc/starlette back test_mcp_auth_google.py (mock RS256 JWKS + an ASGI
# TestClient) — real deps today only via fastmcp's transitive install, which
# a fastmcp version bump could silently drop.
dev = ["pytest>=8.0", "joserfc>=1.0", "starlette>=0.37"]

[project.scripts]
apo-engine = "apo_engine.cli:main"
# Vault-facing, in-process CLI (read/search/write/append/patch/...), mirrors
# the MCP note/vault tools — same backend as engine/mcp/server.py, no daemon,
# requires this package installed and the vault reachable on local disk. NOT
# the admin engine CLI above.
#
# Named apo-local, not apo: `apo` was reserved for the standalone Go client
# (../client/) that speaks MCP over HTTP to a *running* apo-engine server
# (e.g. a containerized one) with no local vault access and none of this
# package's dependencies (duckdb, sqlite-vec, ...). One release (0.27.0)
# shipped this console script as `apo`; renamed in 0.28.0 before the name had
# any real adoption, once the network client made the naming conflict real.
apo-local = "apo_engine.cli_ops:main"
# The MCP server itself — same backend, stdio/http transport instead of
# in-process. `uv tool install`'d onto PATH alongside apo-engine/apo-local.
apo-mcp = "apo_engine.mcp.server:main"
# Naming-consolidation pass (0.29): a single unified entry point, additive —
# apo-engine/apo-local/apo-mcp above are unchanged and keep working. `apo`
# dispatches by leading token: bare note verbs (read/search/write/append/
# patch/patch-table/graph-neighbors/filter/backlinks/history) go to the same
# apo_engine.cli_ops backend as apo-local; `apo engine <cmd>` goes to the
# same apo_engine.cli backend as apo-engine (index/search/search-eval/stats/
# watch/desk-project/okf/serve/optima-merge); `apo mcp` runs the MCP server
# in place, same as apo-mcp. See apo_engine/cli_apo.py's module docstring for
# the full rationale, including how this resolves the `search` name
# collision between the two backends. The Go network client (../client/),
# which used to reserve the bare `apo` name for itself over MCP-over-HTTP,
# is renamed `apo-remote` to free this name up — see ../client/README.md.
apo = "apo_engine.cli_apo:main"

[tool.setuptools.packages.find]
where = ["src"]
